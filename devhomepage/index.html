<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sigma Hideout</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    :root {
      --bg: #0f0c0c;
      --bg-warm: #000000;
      --ember: #400303;
      --ember-dim: #b43838;
      --teal: #3c5a52;
      --text: #ecd9d9;
      --text-dim: #918787;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(ellipse at 50% 20%, var(--bg-warm), var(--bg) 70%);
      color: var(--text);
      font-family: 'Georgia', 'Iowan Old Style', serif;
      overflow-x: hidden;
    }
    canvas#particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
    }
    nav {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 8vw;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    nav .brand {
      font-family: 'Georgia', 'Iowan Old Style', serif;
      font-size: 1.15rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    nav .brand img {
      width: 24px;
      height: 24px;
    }
    nav .brand .fire {
      color: var(--ember-dim);
    }
    nav ul {
      list-style: none;
      display: flex;
      gap: 2rem;
      margin: 0;
      padding: 0;
    }
    nav a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.15s ease;
    }
    nav a:hover {
      color: var(--ember-dim);
    }
    main {
      position: relative;
      z-index: 1;
      min-height: calc(100vh - 70px);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 4vh 8vw 8vh;
      max-width: 640px;
    }
    .badge {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.02em;
      color: var(--text);
      border: 1px solid var(--ember-dim);
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      margin-bottom: 1.6rem;
      background: rgba(255, 19, 19, 0.8);
    }
    h1 {
      font-size: clamp(2.6rem, 8vw, 4.6rem);
      line-height: 1.02;
      margin: 0 0 1.1rem 0;
      font-weight: 400;
      color: var(--text);
      text-shadow: 0 0 40px rgba(255, 19, 19, 0.8);
    }
    p.tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--text-dim);
      max-width: 46ch;
      margin: 0;
    }
    .fire {
      color: var(--ember-dim);
    }
    .countdown {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      border: 1px solid var(--ember-dim);
      background: rgba(64, 3, 3, 0.35);
      border-radius: 12px;
      padding: 1rem 1.4rem;
      margin-bottom: 2rem;
      display: inline-flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .countdown .countdown-label {
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .countdown .countdown-timer {
      display: flex;
      gap: 1.4rem;
    }
    .countdown .countdown-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .countdown .countdown-unit .num {
      font-size: 1.8rem;
      color: var(--ember-dim);
      font-family: 'Georgia', 'Iowan Old Style', serif;
      line-height: 1;
    }
    .countdown .countdown-unit .unit-label {
      font-size: 0.65rem;
      color: var(--text-dim);
      letter-spacing: 0.03em;
      margin-top: 0.2rem;
    }
    @media (max-width: 700px) {
      nav {
        flex-direction: column;
        gap: 0.8rem;
        padding: 1.2rem 6vw;
      }
      nav ul {
        gap: 1.2rem;
      }
    }
  </style>
</head>
<body>
<canvas id="particles"></canvas>

<nav>
  <span class="brand"><img src="/favicon.ico" alt="">sigma <span class="fire">hideout</span></span>
  <ul>
    <li><a href="/home">home</a></li>
    <li><a href="/about">about</a></li>
    <li><a href="/gallery">gallery</a></li>
    <li><a href="/more">more</a></li>
  </ul>
</nav>

<main>
  <!-- page-specific content goes here -->
</main>

<script src="/particles.js?v=2"></script>
<script>
(function () {
  fetch('/events.json')
    .then(res => res.json())
    .then(events => {
      const anniversary = events.anniversary;
      if (!anniversary || !anniversary.enabled) return;

      const main = document.querySelector('main');
      const el = document.createElement('div');
      el.className = 'countdown';
      el.innerHTML = `
        <div class="countdown-label">${anniversary.label || 'Countdown'}</div>
        <div class="countdown-timer">
          <div class="countdown-unit"><span class="num" data-unit="days">--</span><span class="unit-label">days</span></div>
          <div class="countdown-unit"><span class="num" data-unit="hours">--</span><span class="unit-label">hrs</span></div>
          <div class="countdown-unit"><span class="num" data-unit="mins">--</span><span class="unit-label">min</span></div>
          <div class="countdown-unit"><span class="num" data-unit="secs">--</span><span class="unit-label">sec</span></div>
        </div>
      `;
      main.prepend(el);

      const target = new Date(anniversary.date).getTime();

      function tick() {
        const diff = target - Date.now();
        if (diff <= 0) {
          el.querySelector('.countdown-timer').innerHTML = `<div class="countdown-unit"><span class="num">🎉</span></div>`;
          clearInterval(timer);
          return;
        }
        const days = Math.floor(diff / 86400000);
        const hours = Math.floor((diff % 86400000) / 3600000);
        const mins = Math.floor((diff % 3600000) / 60000);
        const secs = Math.floor((diff % 60000) / 1000);
        el.querySelector('[data-unit="days"]').textContent = days;
        el.querySelector('[data-unit="hours"]').textContent = hours;
        el.querySelector('[data-unit="mins"]').textContent = mins;
        el.querySelector('[data-unit="secs"]').textContent = secs;
      }
      tick();
      const timer = setInterval(tick, 1000);
    })
    .catch(err => console.error('Could not load events.json:', err));
})();
</script>
</body>
</html>
