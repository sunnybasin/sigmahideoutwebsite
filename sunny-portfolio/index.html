/* windows */
.window {
  position: absolute;
  z-index: 100;
  width: min(var(--window-w, 620px), calc(100% - 24px));
  height: min(var(--window-h, 500px), calc(100% - 24px));
  min-width: 330px;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid rgba(130, 238, 220, 0.34);
  border-radius: var(--radius);
  background: var(--panel);
  box-shadow: var(--shadow), 0 0 0 1px rgba(0, 0, 0, 0.72);
  backdrop-filter: blur(20px);
  transform-origin: center bottom;
  animation: windowIn 150ms ease-out;
}

@keyframes windowIn {
  from { opacity: 0; transform: translateY(8px) scale(0.985); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.window.is-active {
  border-color: rgba(89, 243, 212, 0.68);
  box-shadow: var(--shadow), 0 0 0 1px rgba(89, 243, 212, 0.12), 0 0 38px rgba(89, 243, 212, 0.06);
}

.window.is-maximized {
  top: 8px !important;
  left: 8px !important;
  width: calc(100% - 16px) !important;
  height: calc(100% - 16px) !important;
  border-radius: 3px;
}

  padding-left: 11px;
  border-bottom: 1px solid rgba(127, 239, 218, 0.18);
  background: linear-gradient(90deg, #123034, #0c2326 62%, #0a1b1e);
  cursor: move;
  user-select: none;
  touch-action: none;
}

.window.is-active .titlebar {
  background: linear-gradient(90deg, #16423f, #103032 62%, #0b2326);
}

.danger-titlebar {
  background: linear-gradient(90deg, #482127, #25171a) !important;
  border-bottom-color: rgba(255, 109, 125, 0.32);
}

.titlebar-title {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  overflow: hidden;
  color: #d1eee8;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.window-app-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--mint);
  box-shadow: 0 0 9px rgba(89, 243, 212, 0.55);
}

.danger-titlebar .window-app-dot {
  background: var(--red);
  box-shadow: 0 0 9px rgba(255, 109, 125, 0.55);
}

.window-controls {
  align-self: stretch;
  display: flex;
}

.window-control {
  width: 40px;
  border: 0;
  border-left: 1px solid rgba(128, 234, 214, 0.12);
  background: transparent;
  color: #87aaa4;
  font-size: 15px;
  cursor: pointer;
}

.window-control:hover {
  background: rgba(89, 243, 212, 0.12);
  color: #fff;
}

.close-btn:hover {
  background: var(--red);
  color: #22060a;
}

.window-body {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 22px;
  background:
    linear-gradient(rgba(89, 243, 212, 0.012) 1px, transparent 1px),
    linear-gradient(90deg, rgba(89, 243, 212, 0.012) 1px, transparent 1px),
    rgba(6, 18, 20, 0.93);
  background-size: 24px 24px;
}

.window-body h2 {
  margin: 4px 0 0;
  font-family: var(--sans);
  font-size: 24px;
  line-height: 1.1;
  letter-spacing: -0.045em;
}

.window-body p {
  color: #a2c3bd;
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.65;
}

.window-resize {
  position: absolute;
  right: 0;
  bottom: 0;
  z-index: 8;
  width: 20px;
  height: 20px;
  cursor: nwse-resize;
  touch-action: none;
}

.window-resize::after {
  content: "";
  position: absolute;
  right: 4px;
  bottom: 4px;
  width: 8px;
  height: 8px;
  border-right: 1px solid var(--muted);
  border-bottom: 1px solid var(--muted);
  box-shadow: 3px 3px 0 -2px var(--muted);
}

.eyebrow,
.panel-label {
  color: var(--mint);
}

.section-heading {
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 20px;
}

.count-badge,
.live-pill {
  flex: 0 0 auto;
  padding: 5px 8px;
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 0.08em;
}

.live-pill {
  color: var(--green);
}

.window-footnote {
  margin: 15px 0 0 !important;
  color: var(--dim) !important;
  font-family: var(--mono) !important;
  font-size: 10px !important;
  line-height: 1.45 !important;
}

.window-footnote code {
  padding: 1px 4px;
  background: rgba(89, 243, 212, 0.08);
  color: var(--mint);
}

/* about */
.about-layout {
  display: flex;
  flex-direction: column;
  gap: 17px;
}

.profile-card {
  display: grid;
  grid-template-columns: 90px 1fr;
  gap: 18px;
  align-items: center;
  padding-bottom: 17px;
  border-bottom: 1px solid var(--line);
}

.profile-avatar {
  position: relative;
  width: 86px;
  height: 86px;
  display: grid;
  place-items: center;
  overflow: hidden;
  border: 1px solid var(--mint);
  background:
    linear-gradient(135deg, rgba(89, 243, 212, 0.2), transparent 60%),
    #0b2425;
  clip-path: polygon(0 0, 81% 0, 100% 19%, 100% 100%, 19% 100%, 0 81%);
}

.profile-avatar::before,
.profile-avatar::after {
  content: "";
  position: absolute;
  width: 120px;
  height: 1px;
  background: rgba(89, 243, 212, 0.25);
  transform: rotate(-35deg);
}

.profile-avatar::after {
  transform: rotate(35deg);
}

.profile-avatar span {
  position: relative;
  z-index: 1;
  color: var(--mint);
  font-family: var(--sans);
  font-size: 43px;
  font-weight: 900;
  letter-spacing: -0.09em;
}

.profile-card p {
  margin: 7px 0 0;
}

.copy-block {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.copy-block p {
  margin: 0;
}

.split-panels {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(190px, 0.8fr);
  gap: 13px;
}

.inset-panel {
  padding: 15px;
  border: 1px solid var(--line);
  background: rgba(14, 38, 40, 0.58);
}

.terminal-list {
  margin: 12px 0 0;
  padding: 0;
  list-style: none;
  color: #9ec1ba;
  font-size: 10px;
  line-height: 1.55;
}

.terminal-list li {
  position: relative;
  margin-top: 7px;
  padding-left: 13px;
}

.terminal-list li::before {
  content: ">";
  position: absolute;
  left: 0;
  color: var(--mint);
}

.compact-stats {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.compact-stats div {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(119, 230, 210, 0.08);
  font-size: 9px;
}

.compact-stats div:last-child { border-bottom: 0; }
.compact-stats span { color: var(--dim); }
.compact-stats strong { color: var(--amber); font-weight: 500; text-align: right; }

/* projects */
.project-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 11px;
}

.project-card {
  position: relative;
  display: grid;
  grid-template-columns: 40px 1fr;
  gap: 12px;
  min-height: 158px;
  padding: 16px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: linear-gradient(145deg, rgba(16, 44, 45, 0.68), rgba(9, 27, 29, 0.76));
  transition: border-color 120ms ease, transform 120ms ease, background 120ms ease;
}

.project-card:hover {
  border-color: rgba(89, 243, 212, 0.48);
  background: linear-gradient(145deg, rgba(20, 57, 56, 0.8), rgba(10, 30, 32, 0.88));
  transform: translateY(-2px);
}

.project-card::after {
  content: "";
  position: absolute;
  right: -35px;
  bottom: -35px;
  width: 75px;
  height: 75px;
  border: 1px solid rgba(89, 243, 212, 0.06);
  transform: rotate(45deg);
}

.project-number {
  color: var(--mint);
  font-size: 20px;
  font-weight: 700;
}

.project-card h3 {
  margin: 1px 0 7px;
  font-family: var(--sans);
  font-size: 16px;
  letter-spacing: -0.025em;
}

.project-card p {
  margin: 0;
  color: #8dafaa;
  font-size: 11px;
  line-height: 1.5;
}

.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 12px;
}

.tag-row span {
  padding: 3px 5px;
  border: 1px solid rgba(89, 243, 212, 0.16);
  color: var(--dim);
  font-size: 8px;
  letter-spacing: 0.05em;
}

/* archer */
.status-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 16px;
  padding: 15px 16px;
  border: 1px solid var(--line);
  background: linear-gradient(90deg, rgba(89, 243, 212, 0.1), rgba(89, 243, 212, 0.02));
}

.big-status-led {
  width: 17px;
  height: 17px;
  border: 4px solid #173a36;
  border-radius: 50%;
  background: var(--amber);
  box-shadow: 0 0 18px rgba(255, 203, 105, 0.6);
}

.big-status-led.online {
  background: var(--green);
  box-shadow: 0 0 20px rgba(132, 245, 125, 0.65);
}

.big-status-led.offline {
  background: var(--red);
  box-shadow: 0 0 20px rgba(255, 109, 125, 0.6);
}

.status-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 9px;
}

.status-card {
  min-width: 0;
  min-height: 74px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 10px;
  padding: 12px;
  border: 1px solid var(--line);
  background: rgba(13, 37, 39, 0.62);
}

.status-card > span,
.metric-card span {
  color: var(--dim);
  font-size: 8px;
  letter-spacing: 0.1em;
}

.status-card strong {
  overflow: hidden;
  color: #c1e5de;
  font-size: 11px;
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.metric-card {
  min-height: 90px;
}

.metric-card > div:first-child {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.metric-card strong {
  color: var(--mint);
}

.wide-card {
  grid-column: span 2;
}

.meter {
  height: 7px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.32);
  border: 1px solid rgba(89, 243, 212, 0.11);
}

.meter i {
  display: block;
  width: 0;
  height: 100%;
  background: linear-gradient(90deg, var(--mint), var(--cyan));
  box-shadow: 0 0 10px rgba(89, 243, 212, 0.35);
  transition: width 400ms ease;
}

/* terminal */
.terminal-window .window-body {
  padding: 0;
  overflow: hidden;
  background: #07100d;
}

.terminal-shell {
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.terminal-toolbar {
  flex: 0 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 10px;
  border-bottom: 1px solid #254034;
  color: #a9c7b4;
  background: #101d18;
  font-size: 9px;
}

.terminal-session,
.terminal-toolbar-status {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.terminal-session strong {
  overflow: hidden;
  color: #e6fff0;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.terminal-session-led {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #72f58a;
  box-shadow: 0 0 8px rgba(114, 245, 138, 0.75);
}

.terminal-toolbar-status span + span {
  padding-left: 8px;
  border-left: 1px solid #385346;
}

.terminal-output {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 15px 16px 8px;
  color: #c7e8d0;
  background:
    repeating-linear-gradient(0deg, rgba(120, 255, 157, 0.018) 0 1px, transparent 1px 3px),
    #07100d;
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  user-select: text;
}

.terminal-output-block + .terminal-output-block {
  margin-top: 8px;
}

.terminal-output .terminal-command-line {
  color: #f4fff7;
}

.terminal-prompt-user,
.terminal-success,
.terminal-command-name,
.terminal-directory {
  color: #7ff39a;
}

.terminal-error {
  color: var(--red);
}

.terminal-warning {
  color: var(--amber);
}

.terminal-info,
.terminal-prompt-path,
.terminal-file,
.terminal-accent {
  color: var(--cyan);
}

.terminal-muted {
  color: #6f947b;
}

.terminal-heading {
  color: #effff3;
  font-weight: 700;
}

.terminal-matrix {
  letter-spacing: 0.06em;
}

.terminal-form {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 38px;
  padding: 7px 16px 8px;
  border-top: 1px solid #183326;
  background: #07100d;
}

.terminal-prompt {
  display: inline-flex;
  align-items: center;
  gap: 0;
  color: #d9f1df;
  font-size: 12px;
  white-space: nowrap;
}

.terminal-prompt-symbol {
  margin-left: 5px;
  color: #e8fff0;
  font-weight: 700;
}

.terminal-input {
  min-width: 0;
  flex: 1;
  padding: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: #f1fff4;
  caret-color: #7ff39a;
  font-size: 12px;
}

.terminal-statusbar {
  flex: 0 0 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 3px 5px 3px 10px;
  border-top: 1px solid #2d4939;
  color: #789984;
  background: #101d18;
  font-size: 8px;
}

.terminal-quick-commands {
  display: flex;
  gap: 4px;
}

.terminal-quick-commands button {
  padding: 2px 7px;
  border: 1px solid #365541;
  background: #172a20;
  color: #b8d9c1;
  font-size: 8px;
  cursor: pointer;
}

.terminal-quick-commands button:hover {
  border-color: #70cf86;
  color: #effff3;
}

/* network */
.network-diagram {
  position: relative;
  min-height: 370px;
  border: 1px solid var(--line);
  background:
    linear-gradient(rgba(89, 243, 212, 0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(89, 243, 212, 0.025) 1px, transparent 1px),
    rgba(5, 16, 18, 0.7);
  background-size: 18px 18px;
}

.network-node {
  position: absolute;
  z-index: 3;
  width: 150px;
  min-height: 64px;
  padding: 9px 10px;
  border: 1px solid rgba(120, 205, 255, 0.32);
  background: rgba(9, 27, 31, 0.96);
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.26);
}

.network-node span {
  display: block;
  color: var(--cyan);
  font-size: 7px;
  letter-spacing: 0.14em;
}

.network-node strong {
  display: block;
  margin-top: 4px;
  color: #d6f1ec;
  font-family: var(--sans);
  font-size: 14px;
  letter-spacing: -0.02em;
}

.network-node small,
.network-node i {
  display: block;
  margin-top: 3px;
  color: var(--dim);
  font-size: 8px;
  font-style: normal;
}

.network-node.primary {
  width: 210px;
  min-height: 88px;
  border-color: var(--mint);
  background: linear-gradient(135deg, rgba(25, 71, 66, 0.96), rgba(9, 30, 31, 0.98));
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.34), 0 0 28px rgba(89, 243, 212, 0.07);
}

.network-node.primary span { color: var(--mint); }
.network-node.primary strong { font-size: 18px; }

.node-internet { top: 20px; left: calc(50% - 75px); }
.node-domain { top: 110px; left: calc(50% - 75px); }
.node-archer { top: 204px; left: calc(50% - 105px); }
.node-tera { left: 24px; bottom: 20px; }
.node-prom { right: 24px; bottom: 20px; }

.network-line {
  position: absolute;
  z-index: 1;
  background: rgba(89, 243, 212, 0.42);
  box-shadow: 0 0 8px rgba(89, 243, 212, 0.18);
}

.network-line.vertical { width: 1px; }
.network-line.horizontal { height: 1px; }
.line-a { top: 84px; left: 50%; height: 26px; }
.line-b { top: 174px; left: 50%; height: 30px; }
.line-c { left: 98px; right: 98px; bottom: 94px; }
.line-d { top: 292px; bottom: 94px; left: 50%; }

.network-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 10px;
  color: var(--dim);
  font-size: 8px;
}

.network-legend span {
  display: flex;
  align-items: center;
  gap: 6px;
}

.network-legend i {
  width: 12px;
  height: 2px;
  background: var(--mint);
}

.network-legend .legend-wan { background: var(--cyan); }
.network-legend .legend-core { height: 8px; border: 1px solid var(--mint); background: transparent; }

/* devlog */
.devlog-body {
  padding-bottom: 40px;
}

.log-entry {
  display: grid;
  grid-template-columns: 84px 1fr;
  gap: 16px;
  padding: 16px 0;
  border-top: 1px solid var(--line);
}

.log-entry time {
  color: var(--mint);
  font-size: 9px;
}

.log-entry h3 {
  margin: -3px 0 6px;
  font-family: var(--sans);
  font-size: 15px;
}

.log-entry p {
  margin: 0;
  color: #91b1ab;
  font-size: 11px;
  line-height: 1.55;
}

/* music */
.music-player {
  display: grid;
  align-content: start;
  grid-template-columns: 148px minmax(0, 1fr);
  grid-template-areas:
    "art now"
    "art progress"
    "controls controls"
    "volume volume"
    "head head"
    "list list"
    "credit credit";
  gap: 13px 18px;
}

.album-art {
  grid-area: art;
  position: relative;
  min-height: 146px;
  overflow: hidden;
  border: 1px solid rgba(89, 243, 212, 0.32);
  background: #0b2425;
}

.album-grid {
  position: absolute;
  inset: 0;
  opacity: 0.35;
  background-image: linear-gradient(rgba(89, 243, 212, 0.15) 1px, transparent 1px), linear-gradient(90deg, rgba(89, 243, 212, 0.15) 1px, transparent 1px);
  background-size: 16px 16px;
}

.album-art > span {
  position: absolute;
  left: 10px;
  bottom: 8px;
  color: var(--mint);
  font-family: var(--sans);
  font-size: 18px;
  font-weight: 900;
  line-height: 0.84;
  letter-spacing: -0.06em;
}

.record {
  position: absolute;
  top: -23px;
  right: -27px;
  width: 125px;
  height: 125px;
  border-radius: 50%;
  background: repeating-radial-gradient(circle, #142e30 0 3px, #0b1d1f 4px 6px);
  box-shadow: 0 15px 32px rgba(0, 0, 0, 0.38);
}

.record i {
  position: absolute;
  inset: 43%;
  border-radius: 50%;
  background: var(--mint);
  box-shadow: 0 0 0 8px #203a3a;
}

.now-playing {
  grid-area: now;
  align-self: end;
}

.now-playing h2 {
  margin-top: 7px;
  overflow: hidden;
  font-size: 20px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.now-playing p {
  margin: 5px 0 0;
  color: var(--dim);
  font-family: var(--mono);
  font-size: 9px;
}

.music-progress-wrap {
  grid-area: progress;
  align-self: start;
}

input[type="range"] {
  width: 100%;
  height: 4px;
  margin: 0;
  appearance: none;
  background: #1b3839;
  accent-color: var(--mint);
  cursor: pointer;
}

input[type="range"]::-webkit-slider-thumb {
  width: 11px;
  height: 11px;
  appearance: none;
  border: 1px solid #0b2425;
  border-radius: 50%;
  background: var(--mint);
  box-shadow: 0 0 8px rgba(89, 243, 212, 0.4);
}

.music-time-row {
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
  color: var(--dim);
  font-size: 8px;
}

.music-controls {
  grid-area: controls;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.round-control {
  width: 35px;
  height: 35px;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  background: #102a2d;
  color: #9bc7c0;
  cursor: pointer;
}

.round-control:hover {
  border-color: var(--mint);
  color: var(--mint);
}

.play-control {
  width: 45px;
  height: 45px;
  border-color: var(--mint);
  background: var(--mint);
  color: #06231d;
}

.play-control:hover {
  background: var(--mint-bright);
  color: #06231d;
}

.music-volume-row {
  grid-area: volume;
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 10px;
  align-items: center;
  color: var(--dim);
  font-size: 8px;
}

.playlist-header {
  grid-area: head;
  display: flex;
  justify-content: space-between;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  color: var(--muted);
}

.music-playlist {
  grid-area: list;
  max-height: 145px;
  overflow: auto;
  border: 1px solid var(--line);
}

.music-playlist-item {
  width: 100%;
  display: grid;
  grid-template-columns: 24px 1fr auto;
  gap: 8px;
  align-items: center;
  padding: 8px 10px;
  border: 0;
  border-bottom: 1px solid rgba(89, 243, 212, 0.08);
  background: rgba(11, 31, 33, 0.72);
  color: #9fc4bd;
  font-size: 9px;
  text-align: left;
  cursor: pointer;
}

.music-playlist-item:last-child { border-bottom: 0; }
.music-playlist-item:hover { background: rgba(19, 52, 51, 0.8); color: #fff; }
.music-playlist-item.active { background: rgba(89, 243, 212, 0.1); color: var(--mint); }
.music-playlist-item .track-index { color: var(--dim); }
.music-playlist-item .track-state { font-size: 8px; }

.music-credit {
  grid-area: credit;
  margin: 0 !important;
  color: var(--dim) !important;
  font-family: var(--mono) !important;
  font-size: 8px !important;
}

/* minecraft */
.minecraft-servers-container {
  display: grid;
  gap: 10px;
}

.loading-state {
  min-height: 210px;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 12px;
  border: 1px solid var(--line);
  color: var(--dim);
}

.loading-state span {
  width: 25px;
  height: 25px;
  border: 2px solid rgba(89, 243, 212, 0.15);
  border-top-color: var(--mint);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

.loading-state p {
  margin: 0;
  font-family: var(--mono);
  font-size: 9px;
}

@keyframes spin { to { transform: rotate(360deg); } }

.minecraft-server-card {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr) auto;
  gap: 13px;
  align-items: center;
  min-height: 85px;
  padding: 13px;
  border: 1px solid var(--line);
  background: rgba(12, 35, 37, 0.65);
}

.minecraft-server-card.online {
  border-left: 2px solid var(--green);
}

.minecraft-server-card.offline {
  border-left: 2px solid var(--red);
  opacity: 0.72;
}

.minecraft-server-icon,
.minecraft-placeholder-icon {
  width: 52px;
  height: 52px;
  object-fit: cover;
  image-rendering: pixelated;
  border: 1px solid var(--line);
  background: #0c2022;
}

.minecraft-placeholder-icon {
  display: grid;
  place-items: center;
  color: var(--green);
  font-size: 22px;
}

.minecraft-main {
  min-width: 0;
}

.minecraft-header {
  display: flex;
  align-items: center;
  gap: 10px;
}

.minecraft-header strong {
  overflow: hidden;
  font-family: var(--sans);
  font-size: 14px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.server-state {
  padding: 2px 5px;
  border: 1px solid currentColor;
  color: var(--red);
  font-size: 7px;
  letter-spacing: 0.08em;
}

.server-state.online { color: var(--green); }

.minecraft-motd {
  margin: 5px 0 0 !important;
  overflow: hidden;
  color: #88aaa4 !important;
  font-family: var(--mono) !important;
  font-size: 9px !important;
  line-height: 1.35 !important;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.minecraft-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 5px 12px;
  margin-top: 7px;
  color: var(--dim);
  font-size: 8px;
}

.minecraft-meta b {
  color: #a3c8c0;
  font-weight: 500;
}

.player-count {
  min-width: 64px;
  text-align: right;
}

.player-count strong {
  display: block;
  color: var(--mint);
  font-family: var(--sans);
  font-size: 20px;
  letter-spacing: -0.05em;
}

.player-count span {
  color: var(--dim);
  font-size: 7px;
  letter-spacing: 0.08em;
}

.minecraft-player-list {
  grid-column: 2 / -1;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: -4px;
}

.minecraft-player-list span {
  padding: 3px 6px;
  border: 1px solid var(--line);
  color: #9fc4bc;
  font-size: 8px;
}

/* secrets and alerts */
.secrets-body {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.warning-symbol {
  width: 68px;
  height: 68px;
  display: grid;
  place-items: center;
  margin-bottom: 14px;
  border: 1px solid var(--red);
  border-radius: 50%;
  color: var(--red);
  font-family: var(--sans);
  font-size: 38px;
  font-weight: 800;
  box-shadow: inset 0 0 25px rgba(255, 109, 125, 0.08), 0 0 20px rgba(255, 109, 125, 0.08);
}

.danger-text { color: var(--red); }

.secrets-body h2 {
  margin-top: 7px;
}

.secrets-body p {
  max-width: 330px;
}

.danger-button {
  border-color: rgba(255, 109, 125, 0.65);
  background: rgba(255, 109, 125, 0.12);
  color: #ffb0ba;
}

.danger-button:hover {
  border-color: var(--red);
  background: var(--red);
  color: #2b090e;
}

.alert-window {
  width: min(380px, calc(100% - 24px));
  height: auto;
  min-height: 178px;
  min-width: 280px;
  border-color: rgba(255, 109, 125, 0.56);
}

.alert-window .window-body {
  display: grid;
  grid-template-columns: 42px 1fr;
  gap: 13px;
  align-items: start;
  padding: 17px;
}

.alert-icon {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border: 1px solid var(--amber);
  border-radius: 50%;
  color: var(--amber);
  font-size: 22px;
}

.alert-copy strong {
  color: #f7d1d5;
  font-family: var(--sans);
  font-size: 14px;
}

.alert-copy p {
  margin: 6px 0 13px;
  color: #a9888d;
  font-family: var(--mono);
  font-size: 10px;
  line-height: 1.45;
}

.toast-region {
  position: absolute;
  z-index: 4300;
  right: 15px;
  bottom: 15px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.toast {
  width: min(340px, calc(100vw - 30px));
  padding: 10px 12px;
  border: 1px solid var(--line-strong);
  background: rgba(6, 20, 22, 0.94);
  color: #b9d9d3;
  box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
  font-size: 9px;
  animation: toastIn 180ms ease-out;
}

@keyframes toastIn {
  from { opacity: 0; transform: translateX(12px); }
}

/* taskbar */
.taskbar {
  position: relative;
  z-index: 5000;
  display: flex;
  align-items: center;
  gap: 7px;
  height: var(--taskbar-h);
  padding: 6px 8px;
  border-top: 1px solid rgba(137, 255, 232, 0.2);
  background: rgba(5, 14, 16, 0.97);
  box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.25);
  backdrop-filter: blur(16px);
}

.start-button {
  flex: 0 0 auto;
  height: 38px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px 0 6px;
  border: 1px solid rgba(89, 243, 212, 0.26);
  background: #10272a;
  color: #d2eee8;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
}

.start-button:hover,
.start-button.active {
  border-color: var(--mint);
  background: #163635;
}

.start-mark {
  width: 25px;
  height: 25px;
  font-size: 14px;
}

.quick-launch {
  display: flex;
  align-items: center;
  gap: 4px;
  padding-right: 7px;
  border-right: 1px solid var(--line);
}

.quick-button {
  width: 34px;
  height: 34px;
  border: 1px solid transparent;
  background: transparent;
  color: #78a49d;
  font-size: 12px;
  cursor: pointer;
}

.quick-button:hover {
  border-color: var(--line);
  background: rgba(89, 243, 212, 0.06);
  color: var(--mint);
}

.taskbar-buttons {
  min-width: 0;
  flex: 1;
  display: flex;
  gap: 5px;
  overflow: auto hidden;
  scrollbar-width: none;
}

.taskbar-buttons::-webkit-scrollbar { display: none; }

.taskbar-window-button {
  flex: 0 1 175px;
  min-width: 76px;
  height: 34px;
  overflow: hidden;
  padding: 0 10px;
  border: 1px solid rgba(89, 243, 212, 0.12);
  background: rgba(13, 31, 34, 0.86);
  color: #779f98;
  font-size: 9px;
  text-align: left;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: pointer;
}

.taskbar-window-button:hover {
  border-color: rgba(89, 243, 212, 0.34);
  color: #c6e5de;
}

.taskbar-window-button.active {
  border-color: rgba(89, 243, 212, 0.5);
  background: rgba(24, 61, 59, 0.88);
  color: var(--mint);
  box-shadow: inset 0 -2px var(--mint);
}

.system-tray {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 3px;
  height: 38px;
  padding: 0 3px;
  border: 1px solid rgba(89, 243, 212, 0.1);
  background: rgba(7, 20, 22, 0.88);
}

.tray-item,
.taskbar-clock {
  height: 29px;
  border: 0;
  background: transparent;
  color: #60847e;
  font-size: 8px;
  cursor: pointer;
}

.tray-item {
  padding: 0 6px;
}

.tray-item:hover,
.taskbar-clock:hover {
  background: rgba(89, 243, 212, 0.07);
  color: #c1e1da;
}

.tray-item.online,
.tray-item.playing {
  color: var(--green);
}

.tray-item.has-alerts {
  color: var(--amber);
}

.tray-led {
  display: inline-block;
  width: 5px;
  height: 5px;
  margin-right: 4px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 6px currentColor;
}

.taskbar-clock {
  min-width: 66px;
  padding: 0 8px;
  color: #a6c4be;
}

/* start menu */
.start-menu {
  position: fixed;
  z-index: 6000;
  left: 8px;
  bottom: calc(var(--taskbar-h) + 7px);
  width: min(580px, calc(100vw - 16px));
  max-height: min(650px, calc(100vh - var(--topbar-h) - var(--taskbar-h) - 22px));
  display: grid;
  grid-template-columns: 62px 1fr;
  overflow: hidden;
  border: 1px solid rgba(89, 243, 212, 0.44);
  border-radius: 6px;
  background: rgba(7, 20, 22, 0.98);
  box-shadow: 0 28px 75px rgba(0, 0, 0, 0.62), 0 0 0 1px rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(20px);
  animation: menuIn 130ms ease-out;
}

@keyframes menuIn {
  from { opacity: 0; transform: translateY(8px); }
}

.start-sidebar {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 18px 7px 12px;
  background: linear-gradient(180deg, #16443e, #0d2829);
  border-right: 1px solid rgba(89, 243, 212, 0.2);
}

.start-sidebar > span {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  color: #d8fff6;
  font-family: var(--sans);
  font-size: 23px;
  font-weight: 900;
  letter-spacing: -0.05em;
}

.start-sidebar small {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  color: rgba(202, 255, 244, 0.45);
  font-size: 7px;
  letter-spacing: 0.14em;
}

.start-content {
  min-width: 0;
  overflow: auto;
  padding: 16px;
}

.start-user {
  display: flex;
  align-items: center;
  gap: 11px;
  padding-bottom: 13px;
  border-bottom: 1px solid var(--line);
}

.start-avatar {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 1px solid var(--mint);
  background: rgba(89, 243, 212, 0.1);
  color: var(--mint);
  font-family: var(--sans);
  font-size: 22px;
  font-weight: 900;
}

.start-user strong {
  display: block;
  font-family: var(--sans);
  font-size: 14px;
}

.start-user span {
  display: block;
  margin-top: 3px;
  color: var(--dim);
  font-size: 8px;
}

.start-section-label {
  margin: 15px 0 9px;
  color: var(--dim);
}

.start-app-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
}

.start-item {
  min-width: 0;
  min-height: 55px;
  display: grid;
  grid-template-columns: 33px 1fr;
  gap: 9px;
  align-items: center;
  padding: 7px 9px;
  border: 1px solid transparent;
  background: transparent;
  color: #b9d8d1;
  text-align: left;
  cursor: pointer;
}

.start-item:hover {
  border-color: var(--line);
  background: rgba(89, 243, 212, 0.07);
}

.start-item > b {
  width: 31px;
  height: 31px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(89, 243, 212, 0.22);
  color: var(--mint);
  font-size: 12px;
}

.start-item > span {
  min-width: 0;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 700;
}

.start-item small {
  display: block;
  margin-top: 3px;
  color: var(--dim);
  font-family: var(--mono);
  font-size: 7px;
  font-weight: 400;
}

.start-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 14px;
  padding-top: 11px;
  border-top: 1px solid var(--line);
}

.start-actions button {
  flex: 1 1 120px;
  min-height: 31px;
  border: 1px solid rgba(89, 243, 212, 0.14);
  background: rgba(9, 28, 30, 0.8);
  color: var(--muted);
  font-size: 8px;
  cursor: pointer;
}

.start-actions button:hover {
  border-color: rgba(89, 243, 212, 0.38);
  color: var(--mint);
}

/* responsiveness */
@media (max-width: 1100px) {
  .desktop-hero {
    left: 205px;
    width: calc(100vw - 470px);
    min-width: 390px;
  }

  .desktop-hero h1 {
    font-size: clamp(38px, 5vw, 58px);
  }

  .desktop-monitor {
    width: 245px;
  }
}

@media (max-width: 820px) {
  :root {
    --topbar-h: 34px;
    --taskbar-h: 48px;
  }

  .topbar {
    grid-template-columns: 1fr auto;
  }

  .topbar-center,
  .topbar-chip,
  .desktop-monitor {
    display: none;
  }

  .desktop {
    overflow-x: hidden;
    overflow-y: auto;
  }

  .desktop-hero {
    position: relative;
    top: auto;
    left: auto;
    width: auto;
    min-width: 0;
    margin: 18px 14px 18px 104px;
    padding: 21px 18px;
  }

  .desktop-hero h1 {
    font-size: clamp(34px, 9vw, 52px);
  }

  .desktop-hero > p {
    font-size: 13px;
  }

  .desktop-icons {
    top: 14px;
    left: 10px;
    grid-template-columns: 78px;
    width: 78px;
    gap: 8px;
  }

  .desktop-icon:nth-child(n+7) {
    display: none;
  }

  .window {
    position: fixed;
    top: calc(var(--topbar-h) + 5px) !important;
    left: 5px !important;
    width: calc(100vw - 10px) !important;
    height: calc(100vh - var(--topbar-h) - var(--taskbar-h) - 10px) !important;
    min-width: 0;
    min-height: 0;
    border-radius: 4px;
  }

  .window-resize,
  .maximize-btn {
    display: none;
  }

  .titlebar {
    cursor: default;
  }

  .window-body {
    padding: 17px;
  }

  .project-grid,
  .copy-block,
  .split-panels {
    grid-template-columns: 1fr;
  }

  .status-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .wide-card {
    grid-column: span 2;
  }

  .network-diagram {
    min-width: 540px;
  }

  #network-window .window-body {
    overflow: auto;
  }

  .system-tray .tray-item:nth-child(-n+3) {
    display: none;
  }

  .quick-launch {
    display: none;
  }

  .taskbar-window-button {
    min-width: 62px;
  }
}

@media (max-width: 560px) {
  .boot-panel {
    min-height: 420px;
    padding: 20px;
  }

  .boot-panel::after {
    display: none;
  }

  .boot-actions {
    align-items: stretch;
    flex-direction: column;
  }

  .boot-actions .button {
    width: 100%;
  }

  .topbar-brand .topbar-divider,
  .topbar-brand .topbar-divider + span {
    display: none;
  }

  .desktop-hero {
    margin-left: 96px;
    padding: 18px 14px;
  }

  .hero-actions {
    flex-direction: column;
  }

  .hero-actions .button {
    width: 100%;
  }

  .hero-system-line span:last-child {
    display: none;
  }

  .desktop-icons {
    left: 6px;
  }

  .desktop-icon:nth-child(n+6) {
    display: none;
  }

  .start-button > span:last-child {
    display: none;
  }

  .start-button {
    padding-right: 6px;
  }

  .system-tray {
    padding: 0;
  }

  .tray-item {
    display: none !important;
  }

  .taskbar-clock {
    min-width: 58px;
  }

  .start-menu {
    grid-template-columns: 46px 1fr;
  }

  .start-content {
    padding: 12px;
  }

  .start-app-grid {
    grid-template-columns: 1fr;
  }

  .start-sidebar > span {
    font-size: 19px;
  }

  .profile-card {
    grid-template-columns: 62px 1fr;
  }

  .profile-avatar {
    width: 60px;
    height: 60px;
  }

  .profile-avatar span {
    font-size: 30px;
  }

  .project-card {
    grid-template-columns: 32px 1fr;
    min-height: 0;
  }

  .music-player {
    grid-template-columns: 92px minmax(0, 1fr);
  }

  .album-art {
    min-height: 98px;
  }

  .record {
    width: 85px;
    height: 85px;
  }

  .album-art > span {
    font-size: 13px;
  }
