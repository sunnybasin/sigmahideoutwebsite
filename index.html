<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sigma Hideout Official Website</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    :root {
      --bg: #0c0f0d;
      --bg-warm: #000000;
      --ember: #400303;
      --ember-dim: #7d0202;
      --teal: #3c5a52;
      --text: #ecd9d9;
      --text-dim: #918787;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(ellipse at 50% 20%, var(--bg-warm), var(--bg) 70%);
      color: var(--text);
      font-family: 'Georgia', 'Iowan Old Style', serif;
      overflow-x: hidden;
    }

    canvas#particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 8vh 8vw;
      max-width: 640px;
    }

    .badge {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.02em;
      color: var(--ember);
      border: 1px solid var(--ember-dim);
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      margin-bottom: 1.6rem;
      background: rgba(232, 163, 61, 0.06);
    }

    h1 {
      font-size: clamp(2.6rem, 8vw, 4.6rem);
      line-height: 1.02;
      margin: 0 0 1.1rem 0;
      font-weight: 400;
      color: var(--text);
      text-shadow: 0 0 40px rgba(232, 163, 61, 0.15);
    }

    p.tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--text-dim);
      max-width: 46ch;
      margin: 0;
    }

    .fire {
      color: var(--ember);
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>

  <main>
    <span class="badge">work in progress</span>
    <h1>wassup <span class="fire"></h1>
    <p class="tagline">
      lowk the website isnt done so yk
      more coming soon
    </p>
  </main>

  <script src="particles.js"></script>
</body>
</html>
