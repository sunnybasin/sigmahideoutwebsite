<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sigma Hideout</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    :root {
      --bg: #0f0c0c;
      --bg-warm: #000000;
      --ember: #400303;
      --ember-dim: #b43838;
      --teal: #3c5a52;
      --text: #ecd9d9;
      --text-dim: #918787;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(ellipse at 50% 20%, var(--bg-warm), var(--bg) 70%);
      color: var(--text);
      font-family: 'Georgia', 'Iowan Old Style', serif;
      overflow-x: hidden;
    }
    canvas#particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
    }
    nav {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 8vw;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    nav .brand {
      font-family: 'Georgia', 'Iowan Old Style', serif;
      font-size: 1.15rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    nav .brand img {
      width: 24px;
      height: 24px;
    }
    nav .brand .fire {
      color: var(--ember-dim);
    }
    nav ul {
      list-style: none;
      display: flex;
      gap: 2rem;
      margin: 0;
      padding: 0;
    }
    nav a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.15s ease;
    }
    nav a:hover {
      color: var(--ember-dim);
    }
    main {
      position: relative;
      z-index: 1;
      min-height: calc(100vh - 70px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4vh 8vw 8vh;
    }
    main img {
      max-width: 220px;
      margin-bottom: 1.5rem;
    }
    .badge {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.02em;
      color: var(--text);
      border: 1px solid var(--ember-dim);
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      margin-bottom: 1.6rem;
      background: rgba(255, 19, 19, 0.8);
    }
    h1 {
      font-size: clamp(2.2rem, 7vw, 3.6rem);
      line-height: 1.02;
      margin: 0 0 1.1rem 0;
      font-weight: 400;
      color: var(--text);
      text-shadow: 0 0 40px rgba(255, 19, 19, 0.8);
    }
    p.tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--text-dim);
      max-width: 46ch;
      margin: 0;
    }
    .fire {
      color: var(--ember-dim);
    }
    @media (max-width: 700px) {
      nav {
        flex-direction: column;
        gap: 0.8rem;
        padding: 1.2rem 6vw;
      }
      nav ul {
        gap: 1.2rem;
      }
    }
  </style>
</head>
<body>
<canvas id="particles"></canvas>
<nav>
  <span class="brand"><img src="/favicon.ico" alt="">sigma <span class="fire">hideout</span></span>
  <ul>
    <li><a href="/home">home</a></li>
    <li><a href="/about">about</a></li>
    <li><a href="/gallery">gallery</a></li>
    <li><a href="/more">more</a></li>
  </ul>
</nav>
<main>
  <img id="random-sunny" src="/sunny.png" alt="Sunny">
  <h1>whoops!</h1>
  <p class="tagline">this page isn't done yet. come back later.</p>
</main>
<script src="/particles.js?v=2"></script>
<script>
  const sunnyImages = ['/sunny.png', '/sunny2.png', '/sunny3.png'];
  const randomImage = sunnyImages[Math.floor(Math.random() * sunnyImages.length)];
  document.getElementById('random-sunny').src = randomImage;
</script>
</body>
</html>
