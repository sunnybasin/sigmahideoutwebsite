<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sigma Hideout — Gallery</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">

  <!-- Link preview tags (Discord, iMessage, Twitter, etc.) -->
  <meta property="og:title" content="Sigma Hideout — Gallery">
  <meta property="og:description" content="Photos and clips shared by the Sigma Hideout crew.">
  <meta property="og:image" content="https://sigmahideout.de/preview.jpg">
  <meta property="og:url" content="https://sigmahideout.de/gallery">
  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sigma Hideout — Gallery">
  <meta name="twitter:description" content="Photos and clips shared by the Sigma Hideout crew.">
  <meta name="twitter:image" content="https://sigmahideout.de/preview.jpg">
  <style>
    :root {
      --bg: #0f0c0c;
      --bg-warm: #000000;
      --ember: #400303;
      --ember-dim: #b43838;
      --teal: #3c5a52;
      --text: #ecd9d9;
      --text-dim: #918787;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(180, 56, 56, 0.25);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(ellipse at 50% 20%, var(--bg-warm), var(--bg) 70%);
      color: var(--text);
      font-family: 'Georgia', 'Iowan Old Style', serif;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: var(--ember-dim) var(--bg);
    }
    ::-webkit-scrollbar {
      width: 12px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--ember);
      border: 2px solid var(--bg);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--ember-dim);
    }
    canvas#particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
    }
    nav {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 8vw;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    nav .brand {
      font-family: 'Georgia', 'Iowan Old Style', serif;
      font-size: 1.15rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    nav .brand img {
      width: 24px;
      height: 24px;
    }
    nav .brand .fire {
      color: var(--ember-dim);
    }
    nav ul {
      list-style: none;
      display: flex;
      gap: 2rem;
      margin: 0;
      padding: 0;
    }
    nav a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.15s ease;
    }
    nav a:hover {
      color: var(--ember-dim);
    }
    main {
      position: relative;
      z-index: 1;
      min-height: calc(100vh - 70px);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      text-align: left;
      padding: 6vh 8vw 10vh;
      width: 100%;
      margin: 0 auto;
    }
    .badge {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.02em;
      color: var(--text);
      border: 1px solid var(--ember-dim);
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      margin-bottom: 1.6rem;
      background: rgba(255, 19, 19, 0.8);
    }
    h1 {
      font-size: clamp(3.2rem, 9vw, 6rem);
      line-height: 1.02;
      margin: 0 0 1.1rem 0;
      font-weight: 400;
      color: var(--text);
      text-shadow: 0 0 40px rgba(255, 19, 19, 0.8);
    }
    p.tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--text-dim);
      max-width: 46ch;
      margin: 0;
    }
    .fire {
      color: var(--ember-dim);
    }
    footer {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 2.5rem 8vw;
      border-top: 1px solid rgba(180, 56, 56, 0.25);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    footer ul {
      list-style: none;
      display: flex;
      gap: 2rem;
      margin: 0;
      padding: 0;
    }
    footer a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.15s ease;
    }
    footer a:hover {
      color: var(--ember-dim);
    }
    footer .copyright {
      font-size: 0.8rem;
      color: var(--text-dim);
      opacity: 0.7;
    }
    @media (max-width: 700px) {
      footer ul {
        flex-wrap: wrap;
        justify-content: center;
        gap: 1.2rem;
      }
    }
    .fade-in {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .fade-in.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
    @media (prefers-reduced-motion: reduce) {
      .fade-in {
        opacity: 1;
        transform: none;
        transition: none;
      }
    }
    .divider {
      width: 100%;
      border: none;
      border-top: 1px solid rgba(180, 56, 56, 0.35);
      margin: 3rem 0;
    }

    /* ---- top row: heading + upload link ---- */
    .gallery-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.2rem;
      width: 100%;
    }
    .upload-link {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: #1a0d0d;
      background: var(--ember-dim);
      padding: 0.65rem 1.3rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: filter 0.15s ease;
      white-space: nowrap;
    }
    .upload-link:hover { filter: brightness(1.1); }

    /* ---- Gallery grid ---- */
    .gallery-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }
    .g-item {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      aspect-ratio: 4 / 3;
      cursor: pointer;
    }
    .g-item img, .g-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .g-item .cap {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 0.5rem 0.6rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.75rem;
      color: #fff;
      background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    .g-item:hover .cap { opacity: 1; }
    .g-item .type-tag {
      position: absolute;
      top: 0.5rem; right: 0.5rem;
      background: rgba(0,0,0,0.55);
      color: var(--text-dim);
      font-size: 0.65rem;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .empty-state {
      color: var(--text-dim);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.9rem;
      padding: 2rem 0;
    }

    /* ---- Lightbox ---- */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 4vh 4vw;
    }
    .lightbox.open { display: flex; }
    .lightbox img, .lightbox video {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 8px;
    }
    .lightbox .close-btn {
      position: absolute;
      top: 1.2rem; right: 1.6rem;
      color: var(--text);
      font-size: 1.8rem;
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
    }

    @media (max-width: 700px) {
      nav {
        flex-direction: column;
        gap: 0.8rem;
        padding: 1.2rem 6vw;
      }
      nav ul {
        gap: 1.2rem;
      }
    }
  </style>
</head>
<body>
<canvas id="particles"></canvas>

<nav>
  <span class="brand"><img src="/favicon.ico" alt="">sigma <span class="fire">hideout</span></span>
  <ul>
    <li><a href="/home">home</a></li>
    <li><a href="/events">events</a></li>
    <li><a href="/gallery">gallery</a></li>
    <li><a href="/more">more</a></li>
  </ul>
</nav>

<main>
  <span class="badge fade-in">shared gallery</span>
  <h1 class="fade-in">The <span class="fire">Gallery</span></h1>
  <p class="tagline fade-in">
    Photos and clips Everything here is visible to everyone in SH.
  </p>

  <hr class="divider fade-in">

  <div class="gallery-top fade-in">
    <span></span>
    <a href="/gallery/upload" class="upload-link">+ Upload something</a>
  </div>

  <div style="height: 1.5rem;"></div>

  <div class="gallery-grid fade-in" id="galleryGrid"></div>
  <div class="empty-state fade-in" id="emptyState" style="display:none;">
    Nothing here yet — <a href="/gallery/upload" style="color: var(--ember-dim);">be the first to post something</a>.
  </div>
</main>

<div class="lightbox" id="lightbox">
  <button class="close-btn" id="lightboxClose">&times;</button>
  <div id="lightboxContent"></div>
</div>

<footer class="fade-in">
  <ul>
    <li><a href="/home">home</a></li>
    <li><a href="/events">events</a></li>
    <li><a href="/gallery">gallery</a></li>
    <li><a href="/more">more</a></li>
  </ul>
  <div class="copyright">&copy; <span id="footer-year"></span> Sigma Hideout. All rights reserved.</div>
</footer>

<script src="/particles.js?v=2"></script>
<script>
  document.getElementById('footer-year').textContent = new Date().getFullYear();

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -50px 0px' });

  document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
</script>
<script>
(function () {
  const galleryGrid = document.getElementById('galleryGrid');
  const emptyState = document.getElementById('emptyState');
  const lightbox = document.getElementById('lightbox');
  const lightboxContent = document.getElementById('lightboxContent');
  const lightboxClose = document.getElementById('lightboxClose');

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function openLightbox(item) {
    lightboxContent.innerHTML = item.type === 'video'
      ? `<video src="${item.url}" controls autoplay></video>`
      : `<img src="${item.url}" alt="">`;
    lightbox.classList.add('open');
  }
  lightboxClose.addEventListener('click', () => {
    lightbox.classList.remove('open');
    lightboxContent.innerHTML = '';
  });
  lightbox.addEventListener('click', e => {
    if (e.target === lightbox) {
      lightbox.classList.remove('open');
      lightboxContent.innerHTML = '';
    }
  });

  async function loadGallery() {
    try {
      const res = await fetch('/api/gallery');
      const items = await res.json();

      galleryGrid.innerHTML = '';
      emptyState.style.display = items.length ? 'none' : 'block';

      items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'g-item';
        const media = item.type === 'video'
          ? `<video src="${item.url}" muted></video>`
          : `<img src="${item.url}" alt="${escapeHtml(item.caption || '')}" loading="lazy">`;
        const capText = [item.uploader, item.caption].filter(Boolean).join(' — ');
        el.innerHTML = `
          ${media}
          <span class="type-tag">${item.type}</span>
          ${capText ? `<span class="cap">${escapeHtml(capText)}</span>` : ''}
        `;
        el.addEventListener('click', () => openLightbox(item));
        galleryGrid.appendChild(el);
      });
    } catch (err) {
      emptyState.style.display = 'block';
      emptyState.textContent = 'Could not load the gallery. Try refreshing.';
    }
  }

  loadGallery();
})();
</script>
</body>
</html>
