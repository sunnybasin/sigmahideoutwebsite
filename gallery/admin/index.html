<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sigma Hideout — Gallery Admin</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --bg: #0f0c0c;
      --bg-warm: #000000;
      --ember: #400303;
      --ember-dim: #b43838;
      --teal: #3c5a52;
      --text: #ecd9d9;
      --text-dim: #918787;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(180, 56, 56, 0.25);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(ellipse at 50% 20%, var(--bg-warm), var(--bg) 70%);
      color: var(--text);
      font-family: 'Georgia', 'Iowan Old Style', serif;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: var(--ember-dim) var(--bg);
    }
    ::-webkit-scrollbar { width: 12px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--ember); border: 2px solid var(--bg); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ember-dim); }
    canvas#particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
    }
    nav {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 8vw;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    nav .brand {
      font-family: 'Georgia', 'Iowan Old Style', serif;
      font-size: 1.15rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    nav .brand img { width: 24px; height: 24px; }
    nav .brand .fire { color: var(--ember-dim); }
    main {
      position: relative;
      z-index: 1;
      min-height: calc(100vh - 70px);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 6vh 8vw 10vh;
      width: 100%;
      margin: 0 auto;
    }
    h1 {
      font-size: clamp(2.2rem, 6vw, 3.2rem);
      line-height: 1.02;
      margin: 0 0 0.6rem 0;
      font-weight: 400;
      color: var(--text);
      text-shadow: 0 0 40px rgba(255, 19, 19, 0.8);
    }
    .fire { color: var(--ember-dim); }
    p.tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-dim);
      max-width: 46ch;
      margin: 0 0 2rem 0;
    }

    /* ---- Gate states (logged out / not admin) ---- */
    .gate-panel {
      width: 100%;
      max-width: 420px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
    }
    .gate-panel p {
      color: var(--text-dim);
      font-size: 0.95rem;
      margin: 0 0 1.4rem 0;
    }
    .discord-login-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: #5865F2;
      color: #fff;
      text-decoration: none;
      padding: 0.75rem 1.6rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: filter 0.15s ease;
    }
    .discord-login-btn:hover { filter: brightness(1.1); }

    /* ---- Admin grid ---- */
    #adminArea { display: none; width: 100%; }
    #adminArea.visible { display: block; }
    .status-bar {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 1.2rem;
      min-height: 1.2em;
    }
    .status-bar.success { color: #8fc9a8; }
    .status-bar.error { color: #e07a7a; }
    .admin-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }
    .a-item {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      aspect-ratio: 4 / 3;
    }
    .a-item img, .a-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .a-item .cap {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 0.5rem 0.6rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.72rem;
      color: #fff;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent 70%);
    }
    .a-item .delete-btn {
      position: absolute;
      top: 0.5rem; right: 0.5rem;
      background: rgba(180, 20, 20, 0.85);
      color: #fff;
      border: none;
      border-radius: 999px;
      width: 30px;
      height: 30px;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      transition: background 0.15s ease;
    }
    .a-item .delete-btn:hover { background: rgba(220, 30, 30, 0.95); }
    .a-item .delete-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .a-item.deleting { opacity: 0.4; }
    .empty-state {
      color: var(--text-dim);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.9rem;
      padding: 2rem 0;
    }
    .top-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .back-link {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: inline-flex;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.15s ease;
    }
    .back-link:hover { color: var(--ember-dim); }
    .who-badge {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.85rem;
      color: var(--text-dim);
    }
    .who-badge img {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid var(--ember-dim);
    }
  </style>
</head>
<body>
<canvas id="particles"></canvas>

<nav>
  <span class="brand"><img src="/favicon.ico" alt="">sigma <span class="fire">hideout</span></span>
</nav>

<main>
  <div id="gateArea">
    <h1>Gallery <span class="fire">Admin</span></h1>
    <p class="tagline">Admin access only — log in with Discord to continue.</p>
    <div class="gate-panel" id="gatePanel">
      <p>Loading...</p>
    </div>
  </div>

  <div id="adminArea">
    <div class="top-row">
      <a href="/gallery" class="back-link">&larr; back to the gallery</a>
      <span class="who-badge" id="whoBadge"></span>
    </div>
    <h1>Gallery <span class="fire">Admin</span></h1>
    <p class="tagline">Click the &times; on anything you want to remove. This can't be undone.</p>
    <div class="status-bar" id="statusBar"></div>
    <div class="admin-grid" id="adminGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">Nothing in the gallery yet.</div>
  </div>
</main>

<script src="/particles.js?v=2"></script>
<script>
(function () {
  const gateArea = document.getElementById('gateArea');
  const gatePanel = document.getElementById('gatePanel');
  const adminArea = document.getElementById('adminArea');
  const whoBadge = document.getElementById('whoBadge');
  const statusBar = document.getElementById('statusBar');
  const adminGrid = document.getElementById('adminGrid');
  const emptyState = document.getElementById('emptyState');

  function setStatus(msg, kind) {
    statusBar.textContent = msg || '';
    statusBar.className = 'status-bar' + (kind ? ' ' + kind : '');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function checkAccess() {
    let data;
    try {
      const res = await fetch('/api/auth/me');
      data = await res.json();
    } catch {
      gatePanel.innerHTML = '<p>Could not check login status. Try refreshing.</p>';
      return;
    }

    if (!data.loggedIn) {
      gatePanel.innerHTML = `
        <p>You need to log in with Discord to access this page.</p>
        <a href="/api/auth/login" class="discord-login-btn">Log in with Discord</a>
      `;
      return;
    }

    if (!data.isAdmin) {
      gatePanel.innerHTML = `
        <p>You're logged in as ${escapeHtml(data.username)}, but this account doesn't have admin access.</p>
      `;
      return;
    }

    // Logged in and authorized — show the admin area.
    gateArea.style.display = 'none';
    adminArea.classList.add('visible');

    whoBadge.innerHTML = data.avatar
      ? `<img src="${data.avatar}" alt="${escapeHtml(data.username)}" title="${escapeHtml(data.username)}">`
      : escapeHtml(data.username);

    loadGallery();
  }

  async function loadGallery() {
    try {
      const res = await fetch('/api/gallery');
      const items = await res.json();

      adminGrid.innerHTML = '';
      emptyState.style.display = items.length ? 'none' : 'block';

      items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'a-item';
        el.dataset.id = item.id;

        const media = item.type === 'video'
          ? `<video src="${item.url}" muted></video>`
          : `<img src="${item.url}" alt="${escapeHtml(item.caption || '')}" loading="lazy">`;
        const capText = [item.uploader, item.caption].filter(Boolean).join(' — ');

        el.innerHTML = `
          ${media}
          <button class="delete-btn" title="Delete">&times;</button>
          ${capText ? `<span class="cap">${escapeHtml(capText)}</span>` : ''}
        `;

        el.querySelector('.delete-btn').addEventListener('click', () => deleteItem(item.id, el));
        adminGrid.appendChild(el);
      });
    } catch (err) {
      setStatus('Could not load the gallery. Try refreshing.', 'error');
    }
  }

  async function deleteItem(id, el) {
    if (!confirm('Delete this item? This cannot be undone.')) return;

    el.classList.add('deleting');
    el.querySelector('.delete-btn').disabled = true;
    setStatus('Deleting...');

    try {
      const res = await fetch(`/api/gallery/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Delete failed.');

      el.remove();
      setStatus('Deleted.', 'success');
      if (adminGrid.children.length === 0) emptyState.style.display = 'block';
    } catch (err) {
      el.classList.remove('deleting');
      el.querySelector('.delete-btn').disabled = false;
      setStatus(err.message || 'Something went wrong.', 'error');
    }
  }

  checkAccess();
})();
</script>
</body>
</html>
