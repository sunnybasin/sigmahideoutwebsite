<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Sign-Off Admin | Sigma Hideout</title><style>
:root{--bg:#0f0c0c;--panel:#191313;--panel2:#211919;--text:#ecd9d9;--muted:#a99999;--line:#382828;--green:#91c99d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}main{width:min(1100px,calc(100% - 32px));margin:44px auto}.eyebrow{color:#b43838;text-transform:uppercase;letter-spacing:.16em;font-size:.75rem;font-weight:700}h1{margin:8px 0 24px;font-size:clamp(2rem,5vw,3rem)}.muted{color:var(--muted);line-height:1.6}.person,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}.person-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.person-name{font-size:1.1rem;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}.section{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}.ok{color:var(--green);font-weight:700}.pending,.small{color:var(--muted)}.sig{font-family:"Segoe Script","Brush Script MT",cursive;font-size:1.3rem;overflow-wrap:anywhere;margin-top:8px}.small{font-size:.82rem;overflow-wrap:anywhere;margin-top:6px}a{color:#d77a7a}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style></head><body><main><div class="eyebrow">Sigma Hideout · Restricted admin</div><h1>Team Sign-Off Records</h1><p class="muted">Only accounts on the configured Discord admin list can view these records. Accounts appear after submitting at least one sign-off.</p><p><a href="/team-signoff-6f9d2c/">← Back to team sign-off</a></p><div id="message" class="panel">Loading sign-off records…</div><div id="records"></div></main><script>
const sections=[['overview','A · Agreement Overview'],['agreement','B · Agreement'],['policies','C · Team Policies'],['nda','D · NDA']];async function load(){const msg=document.getElementById('message'),out=document.getElementById('records');try{const me=await fetch('/api/auth/me').then(r=>r.json());if(!me.loggedIn){location.href='/api/auth/login?return='+encodeURIComponent('/team-signoff-6f9d2c/admin/');return;}if(!me.isAdmin){msg.textContent='You do not have permission to view these records.';return;}const res=await fetch('/api/team-signoff/admin'),data=await res.json();if(!res.ok)throw Error(data.error||'Could not load records.');msg.textContent=data.users.length+' Discord account(s) with at least one recorded sign-off.';if(!data.users.length){msg.textContent='No sign-offs have been submitted yet.';return;}out.replaceChildren();data.users.forEach(user=>{const card=document.createElement('section');card.className='person';const head=document.createElement('div');head.className='person-head';const name=document.createElement('div');name.className='person-name';name.textContent='@'+(user.username||'Unknown Discord user');head.append(name);const id=document.createElement('div');id.className='small';id.textContent='Discord ID: '+user.discordId;head.append(id);card.append(head);const grid=document.createElement('div');grid.className='grid';sections.forEach(([key,label])=>{const rec=user.signoffs[key],cell=document.createElement('div');cell.className='section';const h=document.createElement('strong');h.textContent=label;cell.append(h);const status=document.createElement('div');status.className=rec?'ok':'pending';status.textContent=rec?'✓ Signed':'○ Not signed';cell.append(status);if(rec){const printed=document.createElement('div');printed.className='small';printed.textContent='Printed username: '+(rec.printedUsername||rec.usernameAtSigning||'—');cell.append(printed);const sig=document.createElement('div');sig.className='sig';sig.textContent=rec.typedSignature||'—';cell.append(sig);const when=document.createElement('div');when.className='small';when.textContent=new Date(rec.acceptedAt).toLocaleString();cell.append(when);}grid.append(cell);});card.append(grid);out.append(card);});}catch(e){msg.textContent=e.message;}}load();
</script></body></html>
