<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Sign-Off Admin | Sigma Hideout</title><style>
:root{--bg:#0f0c0c;--panel:#191313;--panel2:#211919;--text:#ecd9d9;--muted:#a99999;--line:#382828;--green:#91c99d;--red:#b43838}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}main{width:min(1100px,calc(100% - 32px));margin:44px auto}.eyebrow{color:var(--red);text-transform:uppercase;letter-spacing:.16em;font-size:.75rem;font-weight:700}h1{margin:8px 0 24px;font-size:clamp(2rem,5vw,3rem)}h2{font-size:1.35rem}.muted{color:var(--muted);line-height:1.6}.person,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}.person-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.person-name{font-size:1.1rem;font-weight:700}.org-group{margin:24px 0 30px}.org-heading{padding:0 0 10px;border-bottom:1px solid var(--line);color:#e7caca}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px}.section{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}.ok{color:var(--green);font-weight:700}.pending,.small{color:var(--muted)}.signature-image{display:block;width:100%;max-width:100%;height:auto;max-height:120px;object-fit:contain;object-position:left center;background:#fff;border-radius:6px;margin-top:8px}.small{font-size:.82rem;overflow-wrap:anywhere;margin-top:6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 11px;border-radius:8px;cursor:pointer;font:inherit;font-size:.85rem}button:hover{border-color:#805252}.danger{border-color:#733737;color:#ffb1b1}.feedback{min-height:1.4em;margin:8px 0;color:#ffb1b1;font-size:.9rem}a{color:#d77a7a}@media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style></head><body><main><div class="eyebrow">Sigma Hideout · Restricted admin</div><h1>Team Sign-Off Records</h1><p class="muted">Only accounts on the configured Discord admin list can view and manage these records. Members are grouped by the organization they volunteer for.</p><p><button id="signout" type="button">Sign out of Discord</button> <a href="/team-signoff-6f9d2c/">← Back to team sign-off</a></p><div id="message" class="panel">Loading sign-off records…</div><p id="feedback" class="feedback" role="status" aria-live="polite"></p><div id="records"></div></main><script>
'use strict';
const sections=[['overview','A · Agreement Overview'],['agreement','B · Volunteer and Contribution Agreements'],['policies','C · Team Policies'],['nda','D · NDA'],['completion','Completion']];
const organizations=['Sigma Hideout Development Group','Aleph Corporation/Auzora Development','Ragdulls'];
const message=document.getElementById('message'),out=document.getElementById('records'),feedback=document.getElementById('feedback');
async function readApiJson(response){const text=await response.text();if(!text.trim())throw Error('The server returned an empty response (HTTP '+response.status+'). Make sure the updated Worker file was uploaded, then refresh this page.');try{return JSON.parse(text);}catch{throw Error('The server returned an invalid response (HTTP '+response.status+'). Make sure the updated Worker file was uploaded, then refresh this page.');}}
async function manageRecord(discordId,section){const deleting=!section,prompt=deleting?'Delete every sign-off record for this Discord account? The member will be able to sign again.':'Reset this section? The member will need to complete it again.';if(!confirm(prompt))return;feedback.textContent='';try{const response=await fetch('/api/team-signoff/admin',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({discordId,...(section?{section}:{})})}),result=await readApiJson(response);if(!response.ok)throw Error(result.error||'Could not update this record.');feedback.textContent=deleting?'All records deleted.':sections.find(item=>item[0]===section)[1]+' reset.';await loadRecords();}catch(error){feedback.textContent=error.message;}}
function createPersonCard(user){
  const card=document.createElement('section');card.className='person';const head=document.createElement('div');head.className='person-head';const name=document.createElement('div');name.className='person-name';name.textContent='@'+(user.username||'Unknown Discord user');head.append(name);const id=document.createElement('div');id.className='small';id.textContent='Discord ID: '+user.discordId;head.append(id);card.append(head);
  const actions=document.createElement('div');actions.className='actions';const deleteButton=document.createElement('button');deleteButton.className='danger';deleteButton.textContent='Delete all records';deleteButton.onclick=()=>manageRecord(user.discordId);actions.append(deleteButton);card.append(actions);
  const grid=document.createElement('div');grid.className='grid';sections.forEach(([key,label])=>{const record=user.signoffs[key],cell=document.createElement('div');cell.className='section';const title=document.createElement('strong');title.textContent=label;cell.append(title);const status=document.createElement('div');status.className=record?'ok':'pending';status.textContent=record?'✓ Complete':'○ Pending';cell.append(status);if(record){if(record.printedUsername||record.usernameAtSigning){const printed=document.createElement('div');printed.className='small';printed.textContent='Printed username: '+(record.printedUsername||record.usernameAtSigning);cell.append(printed);}if(record.signatureImage){const image=document.createElement('img');image.className='signature-image';image.alt='Drawn signature for '+(record.printedUsername||user.username||'signer');image.src=record.signatureImage;cell.append(image);}else if(record.acknowledged){const acknowledgement=document.createElement('div');acknowledgement.className='small';acknowledgement.textContent='Acknowledged';cell.append(acknowledgement);}const when=document.createElement('div');when.className='small';when.textContent=new Date(record.acceptedAt).toLocaleString();cell.append(when);const reset=document.createElement('button');reset.className='danger';reset.style.marginTop='10px';reset.textContent='Reset this section';reset.onclick=()=>manageRecord(user.discordId,key);cell.append(reset);}grid.append(cell);});card.append(grid);return card;
}
async function loadRecords(){const response=await fetch('/api/team-signoff/admin'),data=await readApiJson(response);if(!response.ok)throw Error(data.error||'Could not load records.');message.textContent=data.users.length+' Discord account(s) with at least one recorded sign-off.';out.replaceChildren();if(!data.users.length){message.textContent='No sign-offs have been submitted yet.';return;}const groups=new Map(organizations.map(name=>[name,[]]));groups.set('Organization not selected',[]);for(const user of data.users){const name=organizations.includes(user.organization)?user.organization:'Organization not selected';groups.get(name).push(user);}for(const [name,users] of groups){if(!users.length&&name==='Organization not selected')continue;const group=document.createElement('section');group.className='org-group';const heading=document.createElement('h2');heading.className='org-heading';heading.textContent=name+' ('+users.length+')';group.append(heading);users.forEach(user=>group.append(createPersonCard(user)));out.append(group);}}
document.getElementById('signout').addEventListener('click',async()=>{try{await fetch('/api/auth/logout',{method:'POST'});location.href='/team-signoff-6f9d2c/';}catch{feedback.textContent='Could not sign out. Please try again.';}});
async function load(){try{const authResponse=await fetch('/api/auth/me'),me=await readApiJson(authResponse);if(!me.loggedIn){location.href='/api/auth/login?return='+encodeURIComponent('/team-signoff-6f9d2c/admin/');return;}if(!me.isAdmin){message.textContent='You do not have permission to view these records.';return;}await loadRecords();}catch(error){message.textContent=error.message;}}
load();
</script></body></html>
